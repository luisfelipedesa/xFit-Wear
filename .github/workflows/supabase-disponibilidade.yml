name: Supabase - disponibilidade a cada 5 dias

"on":
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-disponibilidade
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://hnjeknbdgvkzfdwrupau.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EVENTO: ${{ github.event_name }}
    steps:
      - name: Consultar banco somente na data prevista ou no disparo manual
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, timezone
          import os
          import urllib.error
          import urllib.request

          def deve_consultar(data, evento):
              dias = (data - date(2026, 10, 18)).days
              return evento == 'workflow_dispatch' or (dias >= 0 and dias % 5 == 0)

          class SemRedirecionamento(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None

          def consultar_supabase(url, chave):
              if url != 'https://hnjeknbdgvkzfdwrupau.supabase.co' or not chave.startswith('sb_publishable_'):
                  raise ValueError('Configurar URL do projeto e chave publicavel; nao usar service_role')
              request = urllib.request.Request(
                  url + '/rest/v1/rpc/verificar_disponibilidade_xfit',
                  data=b'{}', method='POST',
                  headers={'apikey': chave, 'Content-Type': 'application/json'})
              cliente = urllib.request.build_opener(SemRedirecionamento())
              with cliente.open(request, timeout=20) as resposta:
                  if resposta.status != 200 or resposta.read(64).strip() != b'1':
                      raise ValueError('Consulta nao retornou o resultado esperado')

          def main():
              hoje = datetime.now(timezone.utc).date()
              if not deve_consultar(hoje, os.environ.get('EVENTO', '')):
                  print('Fora do intervalo de cinco dias; nenhuma chamada ao Supabase.')
                  return 0
              try:
                  consultar_supabase(os.environ.get('SUPABASE_URL', ''),
                                     os.environ.get('SUPABASE_PUBLISHABLE_KEY', ''))
              except (ValueError, OSError, urllib.error.URLError):
                  print('Falha na consulta de disponibilidade; revisar projeto, RPC e variavel publicavel.')
                  return 1
              print('Consulta SQL de disponibilidade aprovada; nenhum dado de negocio foi acessado.')
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
