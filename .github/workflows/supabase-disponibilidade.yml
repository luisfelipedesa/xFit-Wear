name: Supabase - disponibilidade diaria

"on":
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-disponibilidade
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://hnjeknbdgvkzfdwrupau.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EVENTO: ${{ github.event_name }}
    steps:
      - name: Consultar banco e registrar disponibilidade
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          import socket
          import ssl
          import urllib.error
          import urllib.request

          class SemRedirecionamento(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None

          def consultar_supabase(url, chave):
              if url != 'https://hnjeknbdgvkzfdwrupau.supabase.co' or not chave.startswith('sb_publishable_'):
                  raise ValueError('Configurar URL do projeto e chave publicavel; nao usar service_role')
              request = urllib.request.Request(
                  url + '/rest/v1/rpc/verificar_disponibilidade_xfit',
                  data=b'{}', method='POST',
                  headers={'apikey': chave, 'Content-Type': 'application/json'})
              cliente = urllib.request.build_opener(SemRedirecionamento())
              with cliente.open(request, timeout=20) as resposta:
                  if resposta.status != 200:
                      raise urllib.error.HTTPError(url, resposta.status, '', {}, None)
                  if resposta.read(64).strip() != b'1':
                      raise RuntimeError('Resposta da RPC diferente de 1')

          def main():
              instante = datetime.now(timezone.utc).isoformat(timespec='seconds')
              evento = os.environ.get('EVENTO', '')
              if evento not in ('schedule', 'workflow_dispatch'):
                  evento = 'outro'
              print(f'Inicio da consulta SQL de disponibilidade: {instante}; evento={evento}.')
              try:
                  consultar_supabase(os.environ.get('SUPABASE_URL', ''),
                                     os.environ.get('SUPABASE_PUBLISHABLE_KEY', ''))
              except urllib.error.HTTPError as erro:
                  orientacoes = {
                      401: 'Revisar a chave publicavel na variavel SUPABASE_PUBLISHABLE_KEY do GitHub.',
                      403: 'Revisar permissoes de EXECUTE da RPC para anon e configuracao de acesso.',
                      404: 'Verificar disponibilidade do projeto e existencia/exposicao da RPC.',
                      429: 'Limite de requisicoes atingido; verificar uso e limites do projeto.',
                  }
                  if 300 <= erro.code < 400:
                      orientacao = 'Redirecionamento bloqueado; revisar o endpoint HTTPS sem seguir redirecionamento.'
                  elif erro.code >= 500:
                      orientacao = 'Servico indisponivel; verificar se o projeto esta pausado, restaurando ou com falha.'
                  else:
                      orientacao = orientacoes.get(erro.code, 'Revisar resposta HTTP e disponibilidade da API no Supabase.')
                  print(f'::error::Falha HTTP {erro.code}. {orientacao}')
                  erro.close()
                  return 1
              except ValueError:
                  print('::error::Falha de configuracao: exigir URL HTTPS exata do projeto e chave sb_publishable_ valida na variavel do GitHub.')
                  return 1
              except RuntimeError:
                  print('::error::Falha de resposta: HTTP 200, mas a RPC nao retornou o inteiro 1. Revisar a funcao verificar_disponibilidade_xfit.')
                  return 1
              except (OSError, urllib.error.URLError) as erro:
                  motivo = getattr(erro, 'reason', erro)
                  if isinstance(motivo, TimeoutError):
                      orientacao = 'Limite de tempo excedido; verificar disponibilidade e rede.'
                  elif isinstance(motivo, ssl.SSLError):
                      orientacao = 'Falha TLS; verificar certificado e conexao HTTPS.'
                  elif isinstance(motivo, socket.gaierror):
                      orientacao = 'Falha DNS; verificar resolucao do endereco do projeto.'
                  else:
                      orientacao = 'Falha de rede; verificar conectividade e disponibilidade do projeto.'
                  # Nao imprimir excecao, corpo ou headers: podem conter credenciais.
                  print(f'::error::{orientacao}')
                  return 1
              print('Consulta SQL de disponibilidade aprovada: HTTP 200; RPC retornou 1. Nenhum dado de negocio foi acessado.')
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
